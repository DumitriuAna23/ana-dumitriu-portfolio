<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ana Dumitriu · Portfolio</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080a0e;
      color: #f3f2ee;
    }

    .loader {
      display: grid;
      justify-items: center;
      gap: 14px;
      opacity: 0.82;
    }

    .mark {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.06em;
    }

    .mark span {
      color: #9db8ff;
    }

    .line {
      width: 82px;
      height: 2px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
    }

    .line::after {
      content: "";
      display: block;
      width: 36px;
      height: 100%;
      border-radius: inherit;
      background: #9db8ff;
      animation: move 0.9s ease-in-out infinite alternate;
    }

    @keyframes move {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(46px);
      }
    }
  </style>
</head>

<body>
  <div class="loader" aria-label="Opening portfolio">
    <div class="mark">AD<span>.</span></div>
    <div class="line" aria-hidden="true"></div>
  </div>

  <script>
    (function () {
      const mobileQuery = window.matchMedia("(max-width: 700px)");
      const destination = mobileQuery.matches
        ? "/mobile/"
        : "/desktop/";

      window.location.replace(destination);
    })();
  </script>

  <noscript>
    <p>
      <a href="/desktop/">Open desktop version</a>
      ·
      <a href="/mobile/">Open mobile version</a>
    </p>
  </noscript>
</body>
</html>
